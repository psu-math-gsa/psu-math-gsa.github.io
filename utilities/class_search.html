  }

  function cartSections() {
    return state.cartIds.map(function (id) { return state.byId[id]; }).filter(Boolean);
  }

  function cartTerms() {
    var seen = {};
    cartSections().forEach(function (s) { if (s.term) seen[s.term] = true; });
    return Core.sortTerms(Object.keys(seen));
  }

  function inTerm(sections, term) {
    return sections.filter(function (s) { return !term || s.term === term; });
  }

  /* Terms worth offering on the grid: whatever is loaded, plus anything in the
     cart, so a term you saved earlier never disappears from the switcher. */
  function boardTerms() {
    var seen = {};
    state.sections.forEach(function (s) { if (s.term) seen[s.term] = true; });
    cartSections().forEach(function (s) { if (s.term) seen[s.term] = true; });
    return Core.sortTerms(Object.keys(seen));
  }

  function setTerm(term) {
    if (state.term === term) return;
    state.term = term;
    $("fTerm").value = term;
    state.preview = [];
    renderAll();
  }

  /* ---------- rendering: results ---------- */

  function seatText(s) {
    if (s.seatsTotal === null) return "";
    return s.seatsAvailable + " / " + s.seatsTotal + " seats";
  }

  function statusLabel(s) {
    var kind = Core.statusKind(s);
    if (kind === "open") return "Open";
    if (kind === "wait") return "Wait list";
    if (kind === "closed") return "Closed";
    return "Unposted";
  }

  function meetingLines(s) {
    var wrap = el("div", "sec-when");
    if (!s.patterns.length) {
      wrap.appendChild(el("div", "async", "No meeting pattern listed"));
      return wrap;
    }
    s.patterns.forEach(function (p) {
      var line = el("div");
      if (p.scheduled) {
        var days = p.days.map(function (d) { return Core.DAY_SHORT[d].slice(0, 2); }).join(" ");
        line.appendChild(el("span", "pattern", days + "  " + Core.formatMinutes(p.start) + "-" + Core.formatMinutes(p.end)));
        if (p.location) line.appendChild(el("span", "where", "  ·  " + p.location));
      } else {
        var tag = p.asyncTags.indexOf("APPT") >= 0 ? "By appointment" : "Online, no set time";
        line.appendChild(el("span", "async", tag));
        if (p.location) line.appendChild(el("span", "where", "  ·  " + p.location));
      }
      wrap.appendChild(line);
    });
    return wrap;
  }

  function sectionRow(s) {
    var row = el("div", "section");
    row.style.setProperty("--h", hueOf(s));
    if (state.cartIds.indexOf(s.id) >= 0) row.classList.add("in-cart");

    var id = el("div", "sec-id");
    id.appendChild(document.createTextNode(s.section + (s.component ? " " + s.component : "")));
    id.appendChild(el("span", "nbr", "#" + s.classNumber));
    if (s.campus) id.appendChild(el("span", "nbr", s.campus));
    row.appendChild(id);

    var middle = el("div");
    if (s.topic) middle.appendChild(el("div", "sec-topic", s.topic));
    middle.appendChild(meetingLines(s));
    if (s.relatedCount) {
      middle.appendChild(el("div", "sec-plus",
        "plus " + (s.relatedKinds.join(" and ") || "a second component") +
        (s.relatedCount > 1 ? " (" + s.relatedCount + " options)" : "")));
    } else if (s.parent) {
      middle.appendChild(el("div", "sec-plus", "goes with " + s.parent.code));
    }
    row.appendChild(middle);

    var who = el("div", "sec-who");
    if (s.instructor) who.textContent = s.instructor;
    else who.appendChild(el("span", "none", "Instructor not posted"));
    row.appendChild(who);

    var act = el("div", "sec-act");
    var inCart = state.cartIds.indexOf(s.id) >= 0;
    var btn = el("button", "btn" + (inCart ? "" : " btn-primary"), inCart ? "Remove" : "Add");
    btn.addEventListener("click", function () { toggleCart(s.id); });
    act.appendChild(btn);
    var pill = el("span", "pill " + Core.statusKind(s), statusLabel(s));
    act.appendChild(pill);
    var seats = seatText(s);
    if (seats) act.appendChild(el("span", "seats", seats));
    if (s.waitlist && Core.statusKind(s) !== "wait") act.appendChild(el("span", "seats", "wait list open"));
    // Seat counts go stale, so say when they were read.
    var stamp = seats ? Core.formatStamp(s.retrievedAt) : "";
    if (stamp) act.appendChild(el("span", "seats stamp", "last updated " + stamp));
    row.appendChild(act);

    row.addEventListener("mouseenter", function () { setPreview([s]); });
    row.addEventListener("mouseleave", function () { setPreview([]); });
    row.addEventListener("focusin", function () { setPreview([s]); });
    return row;
  }

  function setAllExpanded(open) {
    (state.shownCourses || []).forEach(function (key) { state.expanded[key] = open; });
    renderResults();
  }

  function renderResults() {
    var host = $("results");
    host.textContent = "";

    if (!state.sections.length) {
      host.appendChild(emptyState());
      $("resultCount").textContent = "";
      return;
    }

    var matches = Core.filterSections(state.sections, currentFilters());
    var courses = Core.groupCourses(matches);
    $("resultCount").textContent = plural(matches.length, "section") + " in " + plural(courses.length, "course");

    if (!courses.length) {
      var none = el("div", "empty");
      none.appendChild(el("h2", null, "Nothing matches"));
      none.appendChild(el("p", null, "Try a shorter search, or clear a filter."));
      host.appendChild(none);
      return;
    }

    state.shownCourses = courses.map(function (c) { return c.key; });

    courses.forEach(function (course) {
      var box = el("details", "course");
      // Nothing opens by default: hovering the header draws the sections on the
      // grid, which answers "does this fit my week" faster than reading a list.
      box.open = state.expanded[course.key] === true;
      box.addEventListener("toggle", function () { state.expanded[course.key] = box.open; });

      var head = el("summary", "course-head");
      var code = el("span", "course-code");
      code.appendChild(el("span", "chev", "› "));
      code.appendChild(document.createTextNode(course.key));
      head.appendChild(code);
      head.appendChild(el("span", "course-title", course.title));
      var campuses = {};
      course.sections.forEach(function (s) { if (s.campus) campuses[s.campus] = true; });
      var nCampus = Object.keys(campuses).length;
      head.appendChild(el("span", "course-meta",
        plural(course.sections.length, "section") +
        (nCampus > 1 ? " · " + nCampus + " campuses" : "")));
      var preview = course.sections.slice(0, PREVIEW_LIMIT);
      head.addEventListener("mouseenter", function () { setPreview(preview); });
      head.addEventListener("mouseleave", function () { setPreview([]); });
      head.addEventListener("focus", function () { setPreview(preview); });
      head.addEventListener("blur", function () { setPreview([]); });
      if (course.sections.length > PREVIEW_LIMIT) {
        head.title = "Hover previews the first " + PREVIEW_LIMIT + " of " +
          course.sections.length + " sections";
      }
      box.appendChild(head);

      var list = el("div", "sections");
      course.sections.forEach(function (s) { list.appendChild(sectionRow(s)); });
      box.appendChild(list);
      host.appendChild(box);
    });
  }

  function emptyState() {
    var box = el("div", "empty");
    box.appendChild(el("h2", null, "Load a CSV to start"));
    box.appendChild(el("p", null,
      "This reads the files the LionPath scraper writes. Drop them anywhere on this page, or use Load CSV above."));
    box.appendChild(el("p", null, "Generate one like this:"));
    var pre = el("pre", null,
      ".venv/bin/python scrape.py \\\n" +
      "    --subject CMPSC MATH \\\n" +
      "    --campus \"University Park\" \\\n" +
      "    --instructors \\\n" +
      "    -o fall26.csv");
    box.appendChild(pre);
    box.appendChild(el("p", "muted",
      "Run it with --instructors so sections carry instructor names, meeting dates and seat counts. " +
      "You can load several files at once; duplicate classes are merged."));
    return box;
  }

  /* ---------- rendering: calendar ---------- */

  function blocksFor(sections, kind) {
    var out = [];
    sections.forEach(function (s) {
      s.meetings.forEach(function (m) {
        m.days.forEach(function (d) {
          out.push({ day: d, start: m.start, end: m.end, section: s, meeting: m, kind: kind });
        });
      });
    });
    return out;
  }

  function renderTermTabs() {
    var host = $("termTabs");
    host.textContent = "";
    var terms = boardTerms();
    if (terms.length < 2) return;
    terms.forEach(function (term) {
      var tab = el("button", "termtab" + (term === state.term ? " on" : ""), term);
      tab.type = "button";
      tab.setAttribute("aria-pressed", term === state.term ? "true" : "false");
      tab.addEventListener("click", function () { setTerm(term); });
      host.appendChild(tab);
    });
  }

  function renderCalendar() {
    var host = $("calendar");
    host.textContent = "";
    renderTermTabs();

    var cart = inTerm(cartSections(), state.term);
    var shown = cart.slice();
    previewSections().forEach(function (s) {
      if (s.term === state.term && state.cartIds.indexOf(s.id) < 0) shown.push(s);
    });

    var days = Core.activeDays(shown);
    var span = Core.timeSpan(shown, 8 * 60, 21 * 60);
    var startHour = Math.floor(span.start / 60), endHour = Math.ceil(span.end / 60);
    var total = (endHour - startHour) * 60;
    var heightPx = (endHour - startHour) * HOUR_PX;

    var previewing = previewSections().filter(function (s) { return s.term === state.term; }).length;
    $("calHint").textContent = previewing
      ? "previewing " + plural(previewing, "section")
      : cart.length ? plural(cart.length, "section") : "hover a result to preview";

    var grid = el("div", "cal-grid");
    grid.style.setProperty("--days", days.length);
    grid.appendChild(el("div", "cal-corner"));
    days.forEach(function (d) { grid.appendChild(el("div", "cal-daylabel", Core.DAY_SHORT[d])); });

    var gutter = el("div", "cal-gutter");
    gutter.style.height = heightPx + "px";
    for (var h = startHour; h <= endHour; h++) {
      var label = el("div", "cal-hour", Core.formatMinutes(h * 60).replace(":00", ""));
      if (h === startHour) label.classList.add("edge-first");
      if (h === endHour) label.classList.add("edge-last");
      label.style.top = ((h - startHour) * 60 / total * 100) + "%";
      gutter.appendChild(label);
    }
    grid.appendChild(gutter);

    var clashes = Core.findClashes(cart);

    days.forEach(function (d) {
      var col = el("div", "cal-col");
      col.style.height = heightPx + "px";
      for (var h = startHour; h <= endHour; h++) {
        var rule = el("div", "cal-rule");
        rule.style.top = ((h - startHour) * 60 / total * 100) + "%";
        col.appendChild(rule);
        if (h < endHour) {
          var half = el("div", "cal-rule half");
          half.style.top = ((h - startHour) * 60 + 30) / total * 100 + "%";
          col.appendChild(half);
        }
      }

      var dayBlocks = blocksFor(shown, null).filter(function (b) { return b.day === d; });
      var previewIds = {};
      previewSections().forEach(function (s) {
        if (state.cartIds.indexOf(s.id) < 0) previewIds[s.id] = true;
      });
      dayBlocks.forEach(function (b) { b.kind = previewIds[b.section.id] ? "preview" : "cart"; });
      Core.layoutDay(dayBlocks).forEach(function (b) {
        var node = el("div", "blk" + (b.kind === "preview" ? " preview" : ""));
        node.style.setProperty("--h", hueOf(b.section));
        node.style.top = ((b.start - startHour * 60) / total * 100) + "%";
        node.style.height = ((b.end - b.start) / total * 100) + "%";
        var cols = b.columns || 1, colIndex = b.column || 0;
        node.style.left = "calc(" + (colIndex / cols * 100) + "% + 2px)";
        node.style.width = "calc(" + (100 / cols) + "% - 4px)";
        if (clashes.ids[b.section.id] && b.kind !== "preview") node.classList.add("clash");

        // Fit the text to the tile rather than hiding it wholesale: how many
        // lines fit follows from the height, how much each line says from the
        // width once overlapping sections share the column.
        var px = (b.end - b.start) / total * heightPx;
        var capacity = Math.max(0, Math.floor((px - CODE_LINE_PX - BLOCK_PAD_PX) / META_LINE_PX));

        // Even a few pixels get the catalogue number, cut off mid-character. A
        // blank band reads as a rendering fault; a clipped "14" reads as a class.
        node.appendChild(el("span", "code",
          cols > 2 ? b.section.catalog : b.section.courseKey));
        if (cols >= 4) node.classList.add("tight");

        // What each line can usefully say narrows with the tile. The start time is
        // roughly readable from the row itself, so when space runs short the room
        // and the name keep it -- those are the things the grid cannot imply.
        var extras = [];
        var where = b.meeting.location;
        var who = b.section.instructor;
        if (cols === 1) {
          if (capacity >= 3) {
            extras.push(Core.formatMinutes(b.start));
            if (where) extras.push(where);
          } else if (where) {
            extras.push(where);
          } else {
            extras.push(Core.formatMinutes(b.start));
          }
          if (who) extras.push(who);
        } else if (cols === 2) {
          extras.push(where || Core.formatMinutes(b.start));
          if (who) extras.push(Core.shortInstructor(who));
        } else if (cols === 3) {
          if (who) extras.push(Core.shortInstructor(who));
          else if (where) extras.push(where);
        }
        extras.slice(0, capacity).forEach(function (text) {
          node.appendChild(el("span", "meta", text));
        });
        node.title = b.section.code + "  " + b.section.title + "\n" +
          Core.formatMinutes(b.start) + " - " + Core.formatMinutes(b.end) +
          (b.meeting.location ? "\n" + b.meeting.location : "") +
          (b.section.instructor ? "\n" + b.section.instructor : "");
        col.appendChild(node);
      });
      grid.appendChild(col);
    });

    host.appendChild(grid);

    var note = $("clashNote");
    note.textContent = "";
    if (clashes.pairs.length) {
      var lines = clashes.pairs.map(function (p) { return p[0].code + " and " + p[1].code; });
      note.appendChild(el("div", "clash-note",
        (lines.length === 1 ? "Time conflict: " : "Time conflicts: ") + lines.join("; ")));
    }
  }

  function renderAsync() {
    var entries = inTerm(cartSections(), state.term).map(function (s) {
      return { section: s, preview: false };
    });
    previewSections().forEach(function (s) {
      if (s.term === state.term && state.cartIds.indexOf(s.id) < 0) {
        entries.push({ section: s, preview: true });
      }
    });

    // Anything the grid cannot show in full: fully online sections, and classes
    // that meet in person but also carry an online component with no set time.
    var loose = [];
    entries.forEach(function (entry) {
      var note = Core.unscheduledNote(entry.section);
      if (note) loose.push({ section: entry.section, note: note, preview: entry.preview });
    });

    $("asyncSection").hidden = loose.length === 0;
    var inCart = loose.filter(function (e) { return !e.preview; }).length;
    $("asyncCount").textContent = loose.length
      ? (inCart ? plural(inCart, "class") + " to schedule yourself" : "") +
        (inCart && loose.length > inCart ? " \u00b7 " : "") +
        (loose.length > inCart ? plural(loose.length - inCart, "preview") : "")
      : "";
    var host = $("asyncList");
    host.textContent = "";
    loose.forEach(function (entry) {
      var item = el("div", "offgrid" + (entry.preview ? " preview" : ""));
      item.style.setProperty("--h", hueOf(entry.section));
      item.appendChild(el("span", "swatch"));
      var body = el("div");
      body.appendChild(el("span", "lbl", entry.section.code));
      body.appendChild(el("span", "sub", entry.note));
      item.appendChild(body);
      host.appendChild(item);
    });
  }

  function cartItem(s, clashes) {
    var item = el("div", "cart-item" + (clashes.ids[s.id] ? " clash" : ""));
    item.style.setProperty("--h", hueOf(s));

    var bar = el("button", "bar");
    bar.type = "button";
    bar.title = "Change colour for " + (s.colorKey || s.courseKey);
    bar.setAttribute("aria-label", "Change colour for " + (s.colorKey || s.courseKey));
    bar.setAttribute("aria-expanded", state.openPalette === (s.colorKey || s.courseKey) ? "true" : "false");
    bar.addEventListener("click", function () {
      var key = s.colorKey || s.courseKey;
      state.openPalette = state.openPalette === key ? "" : key;
      renderCart();
    });
    item.appendChild(bar);

    var body = el("div");
    body.appendChild(el("div", "code", s.code));
    body.appendChild(el("div", "line", s.topic ? (s.baseTitle || "") + ": " + s.topic : s.title));
    var when = el("div", "line");
    if (s.meetings.length) {
      when.appendChild(el("span", "mono", s.meetings.map(function (m) {
        return m.days.map(function (d) { return Core.DAY_SHORT[d].slice(0, 2); }).join("") +
          " " + Core.formatMinutes(m.start);
      }).join("  /  ")));
    } else {
      when.appendChild(el("span", null, "No set meeting time"));
    }
    if (s.instructor) when.appendChild(document.createTextNode("  \u00b7  " + s.instructor));
    body.appendChild(when);
    item.appendChild(body);

    var remove = el("button", "btn btn-quiet", "Remove");
    remove.setAttribute("aria-label", "Remove " + s.code + " from cart");
    remove.addEventListener("click", function () { toggleCart(s.id); });
    item.appendChild(remove);

    if (state.openPalette === (s.colorKey || s.courseKey)) {
      item.appendChild(palette(s.colorKey || s.courseKey));
    }
    return item;
  }

  function palette(courseKey) {
    var wrap = el("div", "palette");
    wrap.appendChild(el("span", "palette-label", courseKey));
    Core.PALETTE.forEach(function (entry, index) {
      var current = state.colors[courseKey];
      var isOn = current === undefined
        ? index === Core.paletteIndexFor(courseKey)
        : current === index;
      var swatch = el("button", "swatch-btn" + (isOn ? " on" : ""));
      swatch.type = "button";
      swatch.style.setProperty("--h", entry.hue);
      swatch.title = entry.label;
      swatch.setAttribute("aria-label", entry.label);
      swatch.addEventListener("click", function () { setColor(courseKey, index); });
      wrap.appendChild(swatch);
    });
    if (state.colors[courseKey] !== undefined) {
      var reset = el("button", "btn btn-quiet palette-reset", "Reset");
      reset.type = "button";
      reset.addEventListener("click", function () { setColor(courseKey, null); });
      wrap.appendChild(reset);
    }
    return wrap;
  }

  function renderCart() {
    var host = $("cartList");
    host.textContent = "";
    var cart = cartSections();
    var missing = state.cartIds.length - cart.length;

    $("cartCount").textContent = plural(cart.length, "section");
    $("copyCart").disabled = !cart.length;
    $("saveCart").disabled = !cart.length;
    $("saveIcs").disabled = !cart.length;

    if (!cart.length) {
      host.appendChild(el("p", "muted", "Nothing added yet. Use Add on any section."));
      return;
    }

    var clashes = Core.findClashes(cart);
    var terms = cartTerms();

    // One block per semester: a cart that mixes terms is a schedule you can't read.
    terms.forEach(function (term) {
      var members = inTerm(cart, term);
      var group = el("div", "cart-term" + (term === state.term ? " on" : ""));
      var head = el("button", "cart-term-head");
      head.type = "button";
      head.appendChild(el("span", "name", term || "No term"));
      head.appendChild(el("span", "count", plural(members.length, "section")));
      head.setAttribute("aria-label", "Show " + term + " on the grid");
      head.addEventListener("click", function () { setTerm(term); });
      group.appendChild(head);
      members.forEach(function (s) { group.appendChild(cartItem(s, clashes)); });
      host.appendChild(group);
    });

    if (missing > 0) {
      host.appendChild(el("p", "muted",
        plural(missing, "saved section") + (missing === 1 ? " is" : " are") +
        " not in the loaded CSVs, so " + (missing === 1 ? "it is" : "they are") + " hidden."));
    }
  }

  function renderAll() {
    renderResults();
    renderCalendar();
    renderAsync();
    renderCart();
    var n = state.sections.length;
    $("tally").textContent = n
      ? plural(n, "class", "classes") + " from " + plural(state.files.length, "file")
      : "No classes loaded";
    $("clearData").hidden = !n && !state.cartIds.length;
  }

  /* ---------- actions ---------- */

  function hueOf(section) { return Core.hueFor(section.colorKey || section.courseKey, state.colors); }

  function setColor(courseKey, index) {
    if (index === null) delete state.colors[courseKey];
    else state.colors[courseKey] = index;
    state.openPalette = "";
    save();
    renderAll();
  }

  function previewSections() { return state.preview; }

  function setPreview(sections) {
    var next = sections || [];
    var same = next.length === state.preview.length && next.every(function (s, i) {
      return state.preview[i] && state.preview[i].id === s.id;
    });
    if (same) return;
    state.preview = next;
    renderCalendar();
    renderAsync();
  }

  function toggleCart(id) {
    var at = state.cartIds.indexOf(id);
    if (at >= 0) state.cartIds.splice(at, 1);
    else state.cartIds.push(id);
    save();
    renderAll();
  }

  function sortedCart() {
    return cartSections().slice().sort(function (a, b) {
      if (a.subject !== b.subject) return a.subject < b.subject ? -1 : 1;
      var na = parseInt(a.catalog, 10), nb = parseInt(b.catalog, 10);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return a.section < b.section ? -1 : a.section > b.section ? 1 : 0;
    });
  }

  function cartICS() {
    return Core.buildICS(sortedCart(), {
      colors: state.colors,
      skip: state.skipDays,
      termRanges: Core.termDateRanges(state.sections),
      now: new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "")
    });
  }

  function cartCSV() {
    var esc = function (v) {
      v = v === undefined || v === null ? "" : String(v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    var lines = [CSV_COLUMNS.join(",")];
    cartSections().forEach(function (s) {
      lines.push(CSV_COLUMNS.map(function (c) { return esc(s.raw ? s.raw[c] : ""); }).join(","));
    });
    return lines.join("\n") + "\n";
  }

  function say(message) {
    var note = $("exportNote");
    note.textContent = message || "";
    note.hidden = !message;
  }

  function flash(button, message) {
    var original = button.textContent;
    button.textContent = message;
    setTimeout(function () { button.textContent = original; }, 1400);
  }

  /* ---------- wiring ---------- */

  ["q", "fCampus", "fCareer", "fOpen", "fNoClash"].forEach(function (id) {
    var node = $(id);
    node.addEventListener("input", renderResults);
    node.addEventListener("change", renderResults);
  });

  $("fTerm").addEventListener("change", function () { setTerm($("fTerm").value); });

  $("expandAll").addEventListener("click", function () { setAllExpanded(true); });
  $("collapseAll").addEventListener("click", function () { setAllExpanded(false); });

  $("csvInput").addEventListener("change", function (e) {
    readFiles(e.target.files);
    e.target.value = "";
  });

  $("clearData").addEventListener("click", function () {
    state.sections = []; state.byId = {}; state.files = [];
    state.cartIds = []; state.orphanRecords = {}; state.preview = []; state.expanded = {};
    state.colors = {}; state.openPalette = "";
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* nothing to clear */ }
    rebuildFilters();
    renderAll();
    renderPicker();
  });

  $("emptyCart").addEventListener("click", function () {
    state.cartIds = [];
    save();
    renderAll();
  });

  $("copyCart").addEventListener("click", function () {
    var text = Core.toPlainText(sortedCart()), button = $("copyCart");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { flash(button, "Copied"); },
        function () { flash(button, "Copy blocked"); }
      );
    } else {
      flash(button, "Copy blocked");
    }
  });

  /* Saving a file works two different ways depending on where this page is
     opened. From a local file or an ordinary web server a blob link is fine.
     Inside the claude.ai artifact viewer the frame may not download at all, so
     the host mediates it -- and hides the button when it cannot. */
  var downloads = null;
  var hosted = !!(window.claude && typeof window.claude.use === "function");

  function saveViaHost(text, button, filename, mime) {
    return downloads.save({ filename: filename, data: text }).then(
      function () { flash(button, "Saved"); },
      function (err) {
        var code = err && err.code;
        if (code === "declined") return;
        // .ics and .csv are not always allowed through; plain text always is.
        if (code === "extension_not_enabled" || code === "rejected_extension") {
          var plain = filename.replace(/\.[^.]+$/, "") + ".txt";
          return downloads.save({ filename: plain, data: text }).then(
            function () { flash(button, "Saved as .txt"); },
            function () { flash(button, "Save blocked"); }
          );
        }
        flash(button, "Save blocked");
      }
    );
  }

  function saveViaBlob(text, filename, mime, button) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: mime }));
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      if (button) flash(button, "Save blocked");
    }
  }

  $("saveCart").addEventListener("click", function () {
    var text = cartCSV();
    if (downloads) saveViaHost(text, $("saveCart"), "cart.csv", "text/csv");
    else if (!hosted) saveViaBlob(text, "cart.csv", "text/csv", $("saveCart"));
  });

  $("saveIcs").addEventListener("click", function () {
    var built = cartICS(), button = $("saveIcs");
    if (!built.events) { flash(button, "Nothing to add"); return; }

    // Say what the file contains before handing it over, so the report survives
    // a save the browser refuses.
    var messages = [];
    if (built.undated.length) {
      messages.push("No term dates for " + built.undated.join(", ") + ", so " +
                    (built.undated.length === 1 ? "it is" : "they are") + " not in the calendar.");
    }
    if (!state.calendarLoaded) {
      messages.push("Term breaks are not excluded: run fetch_calendar.py to add data/academic-calendar.json.");
    } else if (built.excluded) {
      messages.push(plural(built.excluded, "class meeting") + " skipped for term breaks.");
    }
    say(messages.join(" "));

    if (downloads) saveViaHost(built.text, button, "schedule.ics", "text/calendar");
    else if (!hosted) saveViaBlob(built.text, "schedule.ics", "text/calendar", button);
  });

  if (hosted) {
    // Don't offer the button until the host confirms it can actually save.
    $("saveCart").hidden = true;
    $("saveIcs").hidden = true;
    window.claude.use("downloads").then(function (api) {
      downloads = api;
      $("saveCart").hidden = !api;
      $("saveIcs").hidden = !api;
    }, function () { /* leave them hidden */ });
  }

  var dropzone = $("dropzone"), dragDepth = 0;
  window.addEventListener("dragenter", function (e) {
    e.preventDefault(); dragDepth++; dropzone.classList.add("on");
  });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("dragleave", function (e) {
    e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropzone.classList.remove("on"); }
  });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); dragDepth = 0; dropzone.classList.remove("on");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) readFiles(e.dataTransfer.files);
  });

  try {
    restore();
  } catch (e) {
    // Saved state we can't read is not worth losing the whole page over.
    state.sections = []; state.byId = {}; state.files = []; state.cartIds = [];
    try { localStorage.removeItem(STORE_KEY); } catch (e2) { /* storage unavailable */ }
  }
  renderAll();
  initBundled();
  loadAcademicCalendar();

  // A dropdown should close when you click away from it.
  document.addEventListener("click", function (e) {
    var picker = $("picker");
    if (picker.open && !picker.contains(e.target)) picker.open = false;
  });
})();
</script>
</body>
</html>
